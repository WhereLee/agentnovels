<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel RAG Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-hover: #222222;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-dim: #888888;
            --accent: #4a9eff;
            --accent-dim: #2a5a9a;
            --success: #4caf50;
            --danger: #ef5350;
            --warning: #ff9800;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .header p {
            color: var(--text-dim);
            font-size: 14px;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 40px;
            position: relative;
        }
        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(74, 158, 255, 0.03);
        }
        .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(74, 158, 255, 0.06);
        }
        .upload-area.processing {
            pointer-events: none;
            opacity: 0.7;
        }
        .upload-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.6;
        }
        .upload-text {
            font-size: 15px;
            color: var(--text-dim);
        }
        .upload-text strong {
            color: var(--accent);
            font-weight: 500;
        }
        .upload-hint {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 8px;
            opacity: 0.6;
        }
        #file-input { display: none; }

        /* Progress */
        .progress-bar {
            display: none;
            margin-top: 16px;
        }
        .progress-bar.active { display: block; }
        .progress-track {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s ease;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .progress-text {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 8px;
        }

        /* Novel List */
        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .novel-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .novel-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            transition: all 0.15s ease;
        }
        .novel-card:hover {
            background: var(--surface-hover);
            border-color: #333;
        }

        .novel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .novel-name {
            font-size: 17px;
            font-weight: 600;
        }
        .novel-status {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .status-ready {
            background: rgba(76, 175, 80, 0.12);
            color: var(--success);
        }
        .status-error {
            background: rgba(239, 83, 80, 0.12);
            color: var(--danger);
        }

        .novel-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            font-size: 13px;
            color: var(--text-dim);
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .meta-label { opacity: 0.7; }
        .meta-value { color: var(--text); font-weight: 500; }

        .novel-actions {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        .btn-small {
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-small:hover {
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-chat {
            text-decoration: none;
            display: inline-block;
        }
        .btn-chat:hover {
            border-color: var(--accent) !important;
            color: var(--accent) !important;
        }

        /* Chapter List (expandable) */
        .chapter-toggle {
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            border: none;
            background: none;
            padding: 5px 0;
        }
        .chapter-toggle:hover { text-decoration: underline; }
        .chapter-list {
            display: none;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            color: var(--text-dim);
        }
        .chapter-list.open { display: block; }
        .chapter-item {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 14px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-success { background: var(--success); color: #fff; }
        .toast-error { background: var(--danger); color: #fff; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        /* Vectorize Section */
        .vec-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
        .vec-title { font-size: 12px; color: var(--dim); margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .vec-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .vec-row label { font-size: 12px; color: var(--text-dim); min-width: 60px; }
        .vec-select, .vec-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .vec-select:focus, .vec-input:focus { border-color: var(--accent); outline: none; }
        .vec-input { width: 60px; }
        .vec-btn { padding: 5px 14px; border-radius: 6px; border: none; background: var(--accent); color: #fff; font-size: 12px; cursor: pointer; font-weight: 500; }
        .vec-btn:hover { opacity: 0.85; }
        .vec-btn:disabled { opacity: 0.4; cursor: default; }
        .vec-progress { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
        .vec-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .vec-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s; }
        .vec-strategy-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
        .vec-tab { font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--dim); cursor: pointer; }
        .vec-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Novel RAG Manager</h1>
            <p>上传小说 → 自动检测章节 → 切块处理 · <a href="/viewer" style="color: var(--accent); text-decoration: none;">数据浏览 →</a></p>
        </div>

        <!-- Upload Area -->
        <div class="upload-area" id="upload-area">
            <div class="upload-icon">📖</div>
            <div class="upload-text">
                拖拽 .txt 文件到此处，或 <strong>点击选择</strong>
            </div>
            <div class="upload-hint">支持 GBK / UTF-8 / UTF-16 等编码，自动识别</div>
            <input type="file" id="file-input" accept=".txt">
            <div class="progress-bar" id="progress-bar">
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill" style="width: 30%"></div>
                </div>
                <div class="progress-text" id="progress-text">正在处理...</div>
            </div>
        </div>

        <!-- Novel List -->
        <div class="section-title">已上传的小说</div>
        <div class="novel-list" id="novel-list">
            <div class="empty-state">加载中...</div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const novelList = document.getElementById('novel-list');
        const toast = document.getElementById('toast');

        // === 上传交互 ===
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleUpload(files[0]);
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) handleUpload(fileInput.files[0]);
            fileInput.value = '';
        });

        async function handleUpload(file) {
            if (!file.name.endsWith('.txt')) {
                showToast('仅支持 .txt 文件', 'error');
                return;
            }

            uploadArea.classList.add('processing');
            progressBar.classList.add('active');
            progressText.textContent = `正在上传《${file.name.replace('.txt', '')}》...`;
            progressFill.style.width = '30%';

            const formData = new FormData();
            formData.append('file', file);

            try {
                progressFill.style.width = '60%';
                progressText.textContent = '正在检测编码、章节、切块...';

                const resp = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await resp.json();

                progressFill.style.width = '100%';

                if (resp.ok && data.success) {
                    progressText.textContent = `完成！${data.meta.chapter_count} 章 / ${data.meta.chunk_count} 块`;
                    showToast(data.message, 'success');
                    setTimeout(() => loadNovels(), 500);
                } else {
                    throw new Error(data.detail || '上传失败');
                }
            } catch (err) {
                showToast(err.message, 'error');
                progressText.textContent = '处理失败';
            } finally {
                uploadArea.classList.remove('processing');
                setTimeout(() => {
                    progressBar.classList.remove('active');
                    progressFill.style.width = '30%';
                }, 3000);
            }
        }

        // === 加载小说列表 ===
        async function loadNovels() {
            try {
                const resp = await fetch('/api/novels');
                const data = await resp.json();
                renderNovels(data.novels);
            } catch (err) {
                novelList.innerHTML = '<div class="empty-state">加载失败</div>';
            }
        }

        function renderNovels(novels) {
            if (!novels || novels.length === 0) {
                novelList.innerHTML = '<div class="empty-state">还没有上传任何小说</div>';
                return;
            }

            novelList.innerHTML = novels.map(novel => {
                const statusClass = novel.status === 'ready' ? 'status-ready' : 'status-error';
                const statusText = novel.status === 'ready' ? '就绪' : (novel.status || '未知');
                const chars = novel.total_chars ? (novel.total_chars / 10000).toFixed(1) + ' 万字' : '-';
                const chapterInfo = novel.chapter_detected 
                    ? `${novel.chapter_count} 章（${novel.chapter_pattern}）`
                    : '未检测到章节';

                const chapterListHtml = (novel.chapters || []).map(ch => 
                    `<div class="chapter-item"><span>${ch.index}. ${ch.title}</span><span>${(ch.chars/1000).toFixed(1)}k字</span></div>`
                ).join('');

                return `
                <div class="novel-card">
                    <div class="novel-header">
                        <div class="novel-name">${novel.name}</div>
                        <span class="novel-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="novel-meta">
                        <div class="meta-item"><span class="meta-label">字数</span><span class="meta-value">${chars}</span></div>
                        <div class="meta-item"><span class="meta-label">章节</span><span class="meta-value">${chapterInfo}</span></div>
                        <div class="meta-item"><span class="meta-label">切块</span><span class="meta-value">${novel.chunk_count || '-'} 块</span></div>
                        <div class="meta-item"><span class="meta-label">编码</span><span class="meta-value">${novel.encoding || '-'}</span></div>
                        <div class="meta-item"><span class="meta-label">上传</span><span class="meta-value">${novel.upload_time || '-'}</span></div>
                    </div>
                    <div class="novel-actions">
                        ${(novel.chapters && novel.chapters.length > 0) ? 
                            `<button class="chapter-toggle" onclick="toggleChapters(this)">展开目录 (${novel.chapters.length})</button>` : ''}
                        <a class="btn-small btn-chat" href="/chat?novel=${encodeURIComponent(novel.name)}">对话</a>
                        <button class="btn-small" onclick="deleteNovel('${novel.name}')">删除</button>
                    </div>
                    <div class="chapter-list">${chapterListHtml}</div>
                    <div class="vec-section">
                        <div class="vec-title">向量化</div>
                        <div class="vec-row">
                            <label>batch_size</label>
                            <input class="vec-input" type="number" id="vec-bs-${novel.name}" value="48" min="8" max="256">
                            <label>处理量</label>
                            <select class="vec-select" id="vec-count-${novel.name}">
                                <option value="50">前 50 块</option>
                                <option value="200">前 200 块</option>
                                <option value="-1">全部剩余</option>
                                <option value="custom">自定义</option>
                            </select>
                            <input class="vec-input" type="number" id="vec-custom-${novel.name}" placeholder="N" style="display:none" min="1">
                            <button class="vec-btn" id="vec-btn-${novel.name}" onclick="startVec('${novel.name}')">开始向量化</button>
                        </div>
                        <div class="vec-progress" id="vec-progress-${novel.name}"></div>
                        <div class="vec-bar"><div class="vec-bar-fill" id="vec-bar-${novel.name}" style="width:0%"></div></div>
                    </div>
                </div>`;
            }).join('');
        }

        function toggleChapters(btn) {
            const list = btn.closest('.novel-card').querySelector('.chapter-list');
            list.classList.toggle('open');
            btn.textContent = list.classList.contains('open') 
                ? btn.textContent.replace('展开', '收起')
                : btn.textContent.replace('收起', '展开');
        }

        async function deleteNovel(name) {
            if (!confirm(`确定删除《${name}》的所有数据？此操作不可恢复。`)) return;
            try {
                const resp = await fetch(`/api/novels/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (resp.ok) {
                    showToast(`《${name}》已删除`, 'success');
                    loadNovels();
                } else {
                    const data = await resp.json();
                    showToast(data.detail || '删除失败', 'error');
                }
            } catch (err) {
                showToast('删除失败', 'error');
            }
        }

        // === Toast ===
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = `toast toast-${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // === 向量化控制 ===
        const vecPollers = {};     // {novelName: intervalId}

        // count 选择器联动
        document.addEventListener('change', (e) => {
            if (e.target.id && e.target.id.startsWith('vec-count-')) {
                const novelName = e.target.id.replace('vec-count-', '');
                const customInput = document.getElementById(`vec-custom-${novelName}`);
                customInput.style.display = e.target.value === 'custom' ? 'inline-block' : 'none';
            }
        });

        async function startVec(novelName) {
            const batchSize = parseInt(document.getElementById(`vec-bs-${novelName}`).value) || 48;
            const countSel = document.getElementById(`vec-count-${novelName}`).value;
            const count = countSel === 'custom'
                ? parseInt(document.getElementById(`vec-custom-${novelName}`).value) || 50
                : parseInt(countSel);

            const btn = document.getElementById(`vec-btn-${novelName}`);
            btn.disabled = true;
            btn.textContent = '运行中...';

            try {
                const resp = await fetch(`/api/novels/${encodeURIComponent(novelName)}/vectorize`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ batch_size: batchSize, count }),
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || '启动失败');
                showToast(data.message, 'success');
                // 开始轮询进度
                startPolling(novelName);
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.textContent = '开始向量化';
            }
        }

        function startPolling(novelName) {
            if (vecPollers[novelName]) clearInterval(vecPollers[novelName]);
            vecPollers[novelName] = setInterval(() => pollVecProgress(novelName), 2000);
            pollVecProgress(novelName);
        }

        async function pollVecProgress(novelName) {
            try {
                const resp = await fetch(`/api/novels/${encodeURIComponent(novelName)}/vectorize/progress`);
                const p = await resp.json();
                const progEl = document.getElementById(`vec-progress-${novelName}`);
                const barEl = document.getElementById(`vec-bar-${novelName}`);
                const btn = document.getElementById(`vec-btn-${novelName}`);

                const pct = p.total > 0 ? (p.embedded / p.total * 100).toFixed(1) : 0;
                barEl.style.width = pct + '%';

                if (p.status === 'running') {
                    progEl.textContent = `${p.embedded}/${p.total} (${pct}%)  耗时:${p.elapsed}s  预计剩余:${p.eta}s`;
                    btn.disabled = true;
                    btn.textContent = '运行中...';
                } else if (p.status === 'done') {
                    progEl.textContent = `完成! ${p.embedded}/${p.total}  耗时:${p.elapsed}s`;
                    btn.disabled = false;
                    btn.textContent = '开始向量化';
                    if (vecPollers[novelName]) { clearInterval(vecPollers[novelName]); vecPollers[novelName] = null; }
                } else if (p.status === 'error') {
                    progEl.textContent = `错误: ${p.error}`;
                    btn.disabled = false;
                    btn.textContent = '重新开始';
                    if (vecPollers[novelName]) { clearInterval(vecPollers[novelName]); vecPollers[novelName] = null; }
                } else {
                    progEl.textContent = p.total > 0 ? `已入库: ${p.embedded}/${p.total}  剩余: ${p.remaining}` : '';
                    btn.disabled = false;
                    btn.textContent = '开始向量化';
                }
            } catch (err) { /* ignore */ }
        }

        // === 初始化 ===
        loadNovels();
    </script>
</body>
</html>
